name: Run Playwright Tests

on: 
  push:
  pull_request:
  schedule:
  - cron: '0 9 * * *'   # 09 AM UTC = 5 AM EDT
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps

      - name: Install Allure CLI
        run: |
          set -e
          ALLURE_VERSION=2.25.0
          echo "Installing Allure CLI ${ALLURE_VERSION}"
          wget -qO /tmp/allure.zip "https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/${ALLURE_VERSION}/allure-commandline-${ALLURE_VERSION}.zip"
          sudo unzip -q /tmp/allure.zip -d /opt/
          sudo ln -sf "/opt/allure-${ALLURE_VERSION}/bin/allure" /usr/local/bin/allure
          chmod +x /usr/local/bin/allure
          allure --version

      - name: Run tests
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          SWAGLABS_USERNAME: ${{ secrets.SWAGLABS_USERNAME }}
          SWAGLABS_PASSWORD: ${{ secrets.SWAGLABS_PASSWORD }}
        run: pytest --alluredir=allure-results --allure-pytest-auto-config=allure_pytest_auto.toml
